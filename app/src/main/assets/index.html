<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VRM Companion</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #errorMsg {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-family: sans-serif;
            font-size: 14px;
            text-align: center;
            padding: 16px;
            background: rgba(0,0,0,0.8);
            border-radius: 8px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <canvas id="three-canvas"></canvas>
    <div id="errorMsg"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
        }
      }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        function showError(msg) {
            console.error(msg);
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        // --- WebGL 2.0 capability check ---
        const testCanvas = document.createElement('canvas');
        const testGl = testCanvas.getContext('webgl2');
        if (!testGl) {
            showError('WebGL 2.0 is not supported on this device. A GPU driver update may be required.');
        } else {
            startScene();
        }

        function startScene() {
            try {
                const scene = new THREE.Scene();

                const camera = new THREE.PerspectiveCamera(30, 1.0, 0.1, 100.0);
                camera.position.set(0.0, 1.0, 3.0);
                camera.lookAt(0.0, 1.0, 0.0);

                const renderCanvas = document.getElementById('three-canvas');
                const renderer = new THREE.WebGLRenderer({
                    canvas: renderCanvas,
                    antialias: true,
                    alpha: false,
                    precision: 'mediump',
                    powerPreference: 'default'
                });

                renderer.setClearColor(0x000000, 0);
                renderer.outputColorSpace = THREE.SRGBColorSpace;

                function resize() {
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    if (w > 0 && h > 0) {
                        camera.aspect = w / h;
                        camera.updateProjectionMatrix();
                        renderer.setSize(w, h, false);
                        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    }
                }
                resize();
                window.addEventListener('resize', resize);

                // Lighting
                const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
                dirLight.position.set(1, 1, 1).normalize();
                scene.add(dirLight);
                scene.add(new THREE.AmbientLight(0xffffff, 1.2));

                // State
                let currentVrm = null;
                let speechEndTime = 0;
                const clock = new THREE.Clock();

                // Load VRM
                const loader = new GLTFLoader();
                loader.register(parser => new VRMLoaderPlugin(parser));

                loader.load(
                    'model.vrm',
                    (gltf) => {
                        const vrm = gltf.userData.vrm;
                        if (!vrm) {
                            showError('VRM data missing from model file.');
                            return;
                        }
                        vrm.scene.traverse(obj => { obj.frustumCulled = false; });
                        VRMUtils.rotateVRM0(vrm);
                        scene.add(vrm.scene);
                        currentVrm = vrm;

                        if (window.AndroidBridge && window.AndroidBridge.onModelReady) {
                            window.AndroidBridge.onModelReady();
                        }
                    },
                    undefined,
                    (err) => showError('Model load failed: ' + err.message)
                );

                window.setEmotion = function(name) {
                    if (!currentVrm || !currentVrm.expressionManager) return;
                    const mgr = currentVrm.expressionManager;
                    ['happy', 'angry', 'surprised', 'sad', 'neutral'].forEach(e => mgr.setValue(e, 0));
                    mgr.setValue(name, 1.0);
                };

                window.startSpeech = function(durationMs) {
                    speechEndTime = clock.getElapsedTime() + durationMs / 1000;
                };

                function animate() {
                    requestAnimationFrame(animate);
                    const delta = clock.getDelta();
                    const elapsed = clock.getElapsedTime();

                    if (currentVrm) {
                        const mgr = currentVrm.expressionManager;
                        if (mgr) {
                            if (elapsed < speechEndTime) {
                                const v = (Math.sin(elapsed * 15) + 1) / 2;
                                mgr.setValue('aa', v * 0.8);
                                mgr.setValue('ih', (1 - v) * 0.4);
                            } else {
                                mgr.setValue('aa', 0);
                                mgr.setValue('ih', 0);
                            }
                        }
                        currentVrm.update(delta);
                    }
                    renderer.render(scene, camera);
                }
                animate();

            } catch(e) {
                showError('3D init failed: ' + e.message);
            }
        }
    </script>
</body>
</html>
